# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/
#
# Source-aware adaptation: the React/Vite project lives in source/.
# Keep the IONOS artifact action and project ID below unchanged.

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: source/ionos-static

jobs:
  # Please do not rename this job
  build-project:
    name: build soc-analyst-portfolio
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v22

      - name: Build portable static portfolio from source
        working-directory: source
        env:
          CI: true
          SITE_URL: ${{ inputs.site-url }}
        run: |
          npm install --global pnpm
          pnpm install --frozen-lockfile
          pnpm build:ionos

      # Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 26a1c52e-9e86-4baf-9229-7ac21ed2c607
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/soc-analyst-portfolio/config.yaml
          action: upload
